name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm nx build web --configuration=production

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: |
          firebase deploy --only hosting --project ${{ env.FIREBASE_PROJECT_ID }} --token ${{ secrets.FIREBASE_TOKEN }}

      - name: Close deployed refresh device request
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pr_number="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
              --jq '.[0].number // empty'
          )"

          if [ -z "$pr_number" ]; then
            echo "No pull request is associated with this deployment commit."
            exit 0
          fi

          pr_title="$(gh pr view "$pr_number" --json title --jq '.title')"
          if [ "$pr_title" != "chore(sync-devices): refresh devices data" ]; then
            echo "Pull request #$pr_number is not a refresh devices PR."
            exit 0
          fi

          pr_body="$(gh pr view "$pr_number" --json body --jq '.body')"
          issue_numbers="$(
            printf '%s\n' "$pr_body" |
              perl -nE 'while (/(?:Refs|Part of)\s+#(\d+)/g) { say $1 }' |
              sort -u
          )"

          if [ -z "$issue_numbers" ]; then
            echo "No refresh request issue references were found in PR #$pr_number."
            exit 0
          fi

          for issue_number in $issue_numbers; do
            labels="$(gh issue view "$issue_number" --json labels --jq '.labels[].name')"
            if ! printf '%s\n' "$labels" | grep -qx 'refresh-devices'; then
              echo "Issue #$issue_number does not have the refresh-devices label."
              continue
            fi

            gh issue comment "$issue_number" --body "デバイス情報の更新 PR #$pr_number が \`main\` に取り込まれ、Firebase Hosting へのデプロイが成功しました。

            反映先: https://chirimen-device-dashboard.web.app/"
            gh issue close "$issue_number" --reason completed
          done
