name: Refresh devices data

on:
  workflow_dispatch:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'refresh-devices')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get upstream sources hash
        id: sources
        run: echo "hash=$(sha256sum data/example-upstreams/sources.yaml | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Restore upstream mirrors cache
        uses: actions/cache/restore@v4
        with:
          path: generated/upstreams
          key: example-upstreams-${{ steps.sources.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            example-upstreams-${{ steps.sources.outputs.hash }}-

      - name: Sync example upstreams
        run: pnpm sync:example-upstreams

      - name: Save upstream mirrors cache
        uses: actions/cache/save@v4
        if: success()
        with:
          path: generated/upstreams
          key: example-upstreams-${{ steps.sources.outputs.hash }}-${{ github.run_id }}

      - name: Generate platform examples
        run: pnpm generate:platform-examples

      - name: Validate platform examples
        run: pnpm validate:platform-examples

      - name: Generate devices.json
        run: pnpm generate:devices

      - name: Resolve request context
        id: request
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            echo "issue_number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            echo "related_issue=Fixes #${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "issue_number=" >> "$GITHUB_OUTPUT"
            echo "related_issue=Part of #219" >> "$GITHUB_OUTPUT"
          fi

      - name: Get branch name
        id: branch
        run: |
          if [ -n "${{ steps.request.outputs.issue_number }}" ]; then
            echo "name=chore/refresh-devices-${{ steps.request.outputs.issue_number }}-$(date +%Y-%m-%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          else
            echo "name=chore/refresh-devices-$(date +%Y-%m-%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ${{ steps.branch.outputs.name }}
          add-paths: |
            generated/reports/**
            data/platform-examples/**
            apps/web/public/devices.json
          delete-branch: true
          commit-message: |
            chore(sync-devices): refresh devices data
            Auto-generated by refresh-devices workflow
          title: 'chore(sync-devices): refresh devices data'
          body: |
            ## Summary

            最新の `partslist.csv` と upstream example 同期結果に基づき、デバイス情報の更新候補を作成しました。

            ## Type of change

            - [x] Chore (build/test/ci)

            ## Related issues

            - ${{ steps.request.outputs.related_issue }}

            ## What changed?

            - `apps/web/public/devices.json` — 最新 `partslist.csv` と正本 `platform-examples.json` に基づく再生成結果
            - `data/platform-examples/**` — upstream example から生成した review 用候補 JSON
            - `generated/reports/**` — example 同期・validation レポート

            ## Review points

            - `platform-examples.generated.json` と正本 `platform-examples.json` の差分を確認してください
            - 正本 `platform-examples.json` への手動マージが必要な場合は、レビュー後に別途反映してください
            - `devices.json` の追加・削除・`product.example` 洗い替え結果を確認してください
            - validation レポートに issue / warning がないか確認してください

            ## API / Compatibility

            - [ ] Public API changes (export / function signature / behavior)
              - Details: なし
            - [x] This change is backward compatible
            - [ ] This change introduces a breaking change
              - Migration notes: なし

            ## How to test

            1. `generated/reports/**` の内容が妥当であることを確認
            2. `apps/web/public/devices.json` の差分が期待どおりであることを確認
            3. デバイス一覧が正しく表示されることを確認

            ## Environment (if relevant)

            - Browser: N/A
            - OS: ubuntu-latest
            - Node version: 24
            - pnpm version: `pnpm/action-setup@v4`

            ## Checklist

            - [ ] I ran tests locally (if available)
            - [ ] I updated docs/README if needed
            - [ ] I considered error handling where relevant

      - name: Comment with pull request
        if: github.event_name == 'issues' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ steps.request.outputs.issue_number }}" --body "最新の \`partslist.csv\` と upstream example を同期し、更新 PR を作成しました。

          PR: ${{ steps.cpr.outputs.pull-request-url }}"

      - name: Comment when no changes were found
        if: github.event_name == 'issues' && steps.cpr.outputs.pull-request-number == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ steps.request.outputs.issue_number }}" --body "最新の \`partslist.csv\` と upstream example を同期しましたが、\`main\` との差分はありませんでした。

          ダッシュボードへ反映する追加変更はありません。"

      - name: Comment on failure
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "デバイス情報の同期 workflow が失敗しました。

          Actions の実行結果を確認してください: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
