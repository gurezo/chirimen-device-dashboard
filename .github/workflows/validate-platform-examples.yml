name: Validate platform examples

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate platform examples
        id: validate
        run: pnpm validate:platform-examples

      - name: Upload validation reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: platform-example-validation-reports
          path: generated/reports/*.md
          if-no-files-found: ignore
