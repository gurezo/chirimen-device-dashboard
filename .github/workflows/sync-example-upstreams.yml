name: Sync example upstreams

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get upstream sources hash
        id: sources
        run: echo "hash=$(sha256sum data/example-upstreams/sources.yaml | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Restore upstream mirrors cache
        uses: actions/cache/restore@v4
        with:
          path: generated/upstreams
          key: example-upstreams-${{ steps.sources.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            example-upstreams-${{ steps.sources.outputs.hash }}-

      - name: Sync example upstreams
        run: pnpm sync:example-upstreams

      - name: Save upstream mirrors cache
        uses: actions/cache/save@v4
        if: success()
        with:
          path: generated/upstreams
          key: example-upstreams-${{ steps.sources.outputs.hash }}-${{ github.run_id }}

      - name: Generate platform examples
        run: pnpm generate:platform-examples

      - name: Validate platform examples
        run: pnpm validate:platform-examples

      - name: Generate devices.json
        run: pnpm generate:devices

      - name: Get branch name
        id: branch
        run: echo "name=chore/sync-example-upstreams-$(date +%Y-%m-%d-%H%M%S)" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
          branch: ${{ steps.branch.outputs.name }}
          add-paths: |
            generated/reports
            data/platform-examples
            apps/web/public/devices.json
          delete-branch: true
          commit-message: |
            chore(sync-example-upstreams): update platform example sync artifacts

            Auto-generated by sync-example-upstreams workflow
          title: "chore(sync-example-upstreams): update platform example sync artifacts"
          body: |
            ## Summary
            upstream example repositories の同期結果に基づき、Platform 別 Example 関連の生成物を更新しました。

            ## Type of change
            - [x] Chore (build/test/ci)

            ## Related issues
            - Part of #177
            - Part of #187

            ## What changed?
            - `generated/reports/**` — 同期・validation レポート
            - `data/platform-examples/**` — 生成候補 JSON 等
            - `apps/web/public/devices.json` — `product.example` 洗い替え結果

            ## Review points
            - `example-sync-summary.md` / `example-candidates.md` で upstream 差分を確認してください
            - `platform-examples.generated.json` と正本 `platform-examples.json` の差分を確認し、必要なら手動マージしてください
            - `devices.json` の `product.example` 洗い替え結果を確認してください
            - validation レポート（`platform-example-validation-summary.md` 等）に issue / warning がないか確認してください

            ## How to test
            1. レポート内容が妥当であることを確認
            2. 正本 `platform-examples.json` への手動マージが必要な場合は別 PR で対応
            3. ビルドが通ることを確認

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash
