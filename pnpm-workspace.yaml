packages: []

# 明示設定時は strict がデフォルト true のため、lockfile 再生成時に exclude が自動追記される
minimumReleaseAgeStrict: false

minimumReleaseAgeExclude:
  # 公開から 7 日未満の依存も許可 (Angular / Nx 更新・ツールチェーン向け)
  - '@analogjs/*'
  - '@angular/*'
  - '@angular-devkit/*'
  - '@angular-eslint/*'
  - '@commitlint/*'
  - '@eslint/*'
  - '@inquirer/*'
  - '@jsonjoy.com/*'
  - '@ngtools/*'
  - '@ngrx/*'
  - '@nx/*'
  - '@oxc-project/*'
  - '@playwright/*'
  - '@schematics/*'
  - '@swc/*'
  - '@testing-library/*'
  - '@types/*'
  - '@typescript-eslint/*'
  - '@vitest/*'
  - angular-eslint
  - firebase-tools
  - memfs
  - nx
  - playwright
  - playwright-core
  - tinyglobby
  - tmp
  - typescript
  - typescript-eslint
  - vite
  - vitest
  - postcss@8.5.16
  - prettier@3.9.4
  - tsx@4.23.0

# 悪意のあるリリースは1週間以内に発見され、レジストリから削除される為
# config = 7 day x 24h x 60 min
minimumReleaseAge: 10080

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: true
  less: false
  lmdb: false
  msgpackr-extract: false
  nx: true
  protobufjs: false
  re2: false
  unrs-resolver: false
