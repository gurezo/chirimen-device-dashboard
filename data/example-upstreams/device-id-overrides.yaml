# example device id → dashboard device id の手動 override
#
# 自動推定で曖昧・未解決の場合に使用します。
# key: exampleDeviceId（例: adt7410）
# value: dashboardDeviceId または dashboardDeviceId の配列（例: i2c-adt7410）

overrides:
  adt7410: i2c-adt7410
  hbridge2-pca9685pwm: i2c-pca9685-pwm
  hbridge1:
    - gpio-l298n
    - gpio-l9110s
    - gpio-mx1508
    - actuator-device
  paj7620: i2c-grove-gesture-paj7620u2
  max30102: i2c-max30102
  qrcodescanner: i2c-m5-qr-stm32f030
  waveshare20471: i2c-waveshare-20471
  grove-water-level-sensor: i2c-grove
  seesaw: i2c-seesaw
