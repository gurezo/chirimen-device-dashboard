<div class="flex flex-col flex-1 min-h-0 overflow-hidden">
  <div
    class="flex-shrink-0 flex flex-col items-stretch gap-2 py-2 px-4 border-b border-black/12 dark:border-white/12 sm:flex-row sm:items-start sm:justify-between sm:gap-4"
  >
    <mat-form-field
      appearance="outline"
      class="w-full min-w-0 sm:flex-1 sm:max-w-[32rem]"
    >
      <mat-label>検索</mat-label>
      <input
        matInput
        [ngModel]="query()"
        (ngModelChange)="onQueryChange($event)"
        placeholder="デバイスを検索"
      />
      <mat-hint>
        <span class="sm:hidden">例: i2c raspberry</span>
        <span class="hidden sm:inline">
          名前・タグ・カテゴリ・説明・対応環境（例: i2c raspberry）
        </span>
      </mat-hint>
    </mat-form-field>
    <mat-button-toggle-group
      class="flex-shrink-0 self-start sm:mt-1"
      [value]="viewMode()"
      (valueChange)="setViewMode($event)"
      aria-label="表示形式"
    >
      <mat-button-toggle value="table">テーブル表示</mat-button-toggle>
      <mat-button-toggle value="card">カード表示</mat-button-toggle>
    </mat-button-toggle-group>
  </div>
  <div class="flex flex-1 min-h-0 overflow-hidden flex flex-col">
    @if (viewMode() === 'table') {
      <choh-device-list />
    } @else {
      <choh-device-card-list />
    }
  </div>
</div>
